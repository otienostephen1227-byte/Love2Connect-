<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Love2Connect - Elite Social Discovery</title>
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Lucide Icons -->
  <script src="https://unpkg.com/lucide@latest"></script>
  <!-- Supabase JS SDK -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body class="bg-slate-900 text-slate-100 pb-24 font-sans antialiased">

  <!-- Top Header -->
  <header class="sticky top-0 z-20 bg-slate-900/80 backdrop-blur-md border-b border-slate-800 px-4 py-3 flex items-center justify-between">
    <div class="flex items-center space-x-2">
      <div class="w-9 h-9 rounded-xl bg-gradient-to-tr from-pink-500 to-purple-600 flex items-center justify-center shadow-lg shadow-pink-500/20">
        <i data-lucide="heart" class="w-5 h-5 text-white fill-current"></i>
      </div>
      <div>
        <h1 class="text-base font-bold tracking-tight text-white">Love2Connect</h1>
        <p id="backend-status" role="status" class="text-[10px] text-pink-400 font-medium">Loading configuration...</p>
      </div>
    </div>
    <div class="flex items-center space-x-2">
      <button onclick="switchTab('profile')" class="bg-slate-800 hover:bg-slate-700 border border-slate-700 px-3 py-1.5 rounded-full text-xs font-semibold flex items-center space-x-1.5 transition">
        <i data-lucide="user" class="w-3.5 h-3.5 text-pink-400" aria-hidden="true"></i>
        <span>Profile</span>
      </button>
    </div>
  </header>

  <!-- Main Content Area -->
  <main id="main-content" aria-live="polite" class="p-4 max-w-md mx-auto w-full min-h-[80vh]">
    <!-- Dynamic Content -->
  </main>
  <noscript><p class="p-4 text-center text-slate-300">Enable JavaScript to navigate Love2Connect. Accounts, messaging, payments, and calls are not available in this static version.</p></noscript>

  <!-- Bottom Navigation Bar -->
  <nav aria-label="Main navigation" class="fixed bottom-0 left-0 right-0 max-w-md mx-auto bg-slate-900/90 backdrop-blur-lg border-t border-slate-800 px-6 py-2.5 flex justify-around items-center z-50">
    <button onclick="switchTab('discover')" id="nav-discover" class="nav-btn flex flex-col items-center space-y-1 text-pink-500 font-semibold transition">
      <i data-lucide="sparkles" class="w-5 h-5 stroke-[2.5px]"></i>
      <span class="text-[10px]">Discover</span>
    </button>
    <button onclick="switchTab('chat')" id="nav-chat" class="nav-btn flex flex-col items-center space-y-1 text-slate-400 hover:text-slate-200 transition">
      <i data-lucide="message-square" class="w-5 h-5 stroke-2"></i>
      <span class="text-[10px]">Chat</span>
    </button>
    <button onclick="switchTab('call')" id="nav-call" class="nav-btn flex flex-col items-center space-y-1 text-slate-400 hover:text-slate-200 transition">
      <i data-lucide="phone-call" class="w-5 h-5 stroke-2"></i>
      <span class="text-[10px]">Calls</span>
    </button>
    <button onclick="switchTab('profile')" id="nav-profile" class="nav-btn flex flex-col items-center space-y-1 text-slate-400 hover:text-slate-200 transition">
      <i data-lucide="user" class="w-5 h-5 stroke-2"></i>
      <span class="text-[10px]">Profile</span>
    </button>
  </nav>

  <script>
    // Supabase Configuration
    const supabaseUrl = 'https://ycoywnfsfqygubszrzzt.supabase.co';
    const supabaseAnonKey = 'sb_publishable_240ym7HucnCx-1d3PvuhOg_8ReZALm6';
    let supabaseClient = null;
    let currentTab = 'discover';
    const availableTabs = ['discover', 'chat', 'call', 'profile'];

    function initializeBackend() {
      const status = document.getElementById('backend-status');
      if (!window.supabase || !supabaseUrl || !supabaseAnonKey) {
        status.textContent = 'Supabase client unavailable';
        return;
      }
      try {
        supabaseClient = window.supabase.createClient(supabaseUrl, supabaseAnonKey);
        status.textContent = 'Supabase configured · Accounts unavailable';
      } catch {
        status.textContent = 'Supabase configuration could not be loaded';
      }
    }

    function switchTab(tab) {
      if (!availableTabs.includes(tab)) return;
      currentTab = tab;
      document.querySelectorAll('.nav-btn').forEach(button => {
        const active = button.id === 'nav-' + tab;
        button.className = 'nav-btn flex flex-col items-center space-y-1 transition ' +
          (active ? 'text-pink-500 font-semibold' : 'text-slate-400 hover:text-slate-200');
        if (active) button.setAttribute('aria-current', 'page');
        else button.removeAttribute('aria-current');
      });
      renderContent();
    }

    function unavailableCard(icon, title, description) {
      return `<section class="bg-slate-800/60 border border-slate-700/80 rounded-3xl p-6 space-y-4 shadow-xl">
        <div class="w-12 h-12 rounded-2xl bg-gradient-to-br from-pink-500/20 to-purple-600/20 flex items-center justify-center">
          <i data-lucide="${icon}" class="w-6 h-6 text-pink-400" aria-hidden="true"></i>
        </div>
        <h2 class="text-xl font-bold text-white">${title}</h2>
        <p class="text-sm text-slate-300 leading-relaxed">${description}</p>
        <span class="inline-block rounded-full border border-slate-700 bg-slate-900/60 px-3 py-1 text-xs text-slate-400">Not yet available</span>
      </section>`;
    }

    function renderContent() {
      const main = document.getElementById('main-content');
      if (!main) return;
      if (currentTab === 'discover') {
        main.innerHTML = `<section class="space-y-5">
          <div>
            <h2 class="text-xl font-extrabold tracking-tight text-white">Discover Matches</h2>
            <p class="text-xs text-slate-400 mt-1">Real connections start with real profiles.</p>
          </div>
          ${unavailableCard('heart', 'Discover is not connected yet', 'Member discovery requires authenticated accounts and a securely connected profile database. No fictional profiles are displayed as real members.')}
          <button type="button" onclick="switchTab('profile')" class="w-full bg-gradient-to-r from-pink-500 to-purple-600 text-white font-semibold rounded-xl px-4 py-3 hover:opacity-90 focus-visible:outline focus-visible:outline-2 focus-visible:outline-pink-400">View profile status</button>
        </section>`;
      } else if (currentTab === 'chat') {
        main.innerHTML = unavailableCard('message-square', 'Chat is not connected yet', 'Private messaging requires signed-in accounts, a mutual match, and secure database access. Messages cannot be sent or saved in this version.');
      } else if (currentTab === 'call') {
        main.innerHTML = unavailableCard('phone-call', 'Voice & video calls are unavailable', 'Calling is not implemented. No call is started, no microphone or camera access is requested, and no calling credits are charged.') +
          '<button type="button" disabled class="w-full mt-4 px-4 py-3 rounded-xl bg-slate-800 text-slate-500 cursor-not-allowed">Calling unavailable</button>';
      } else if (currentTab === 'profile') {
        main.innerHTML = `<section class="space-y-5">
          ${unavailableCard('user', 'Your profile', 'Registration, login, and profile editing are not implemented in this static repair. Existing Supabase configuration is preserved, but it does not establish an authenticated account or save a profile.')}
          <section class="bg-gradient-to-br from-emerald-900/20 to-slate-800 border border-slate-700 rounded-3xl p-6 space-y-3">
            <h2 class="text-lg font-bold text-white">M-Pesa payments</h2>
            <p class="text-sm text-slate-300 leading-relaxed">Payments are unavailable until secure server-side payment initiation and confirmation are implemented. No payment is requested and no credits are awarded.</p>
            <button type="button" disabled class="w-full px-4 py-3 rounded-xl bg-slate-800 text-slate-500 cursor-not-allowed">M-Pesa unavailable</button>
          </section>
        </section>`;
      }
      if (window.lucide) window.lucide.createIcons();
    }

    initializeBackend();
    switchTab(currentTab);
  </script>
</body>
</html>
