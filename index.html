      <span class="text-[10px]">Discover</span>
    </button>
    <button onclick="switchTab('chat')" id="nav-chat" class="nav-btn flex flex-col items-center space-y-1 text-slate-400 hover:text-slate-200 transition">

    function switchTab(tab) {
      currentTab = tab;
      
      document.querySelectorAll('.nav-btn').forEach(btn => {
        btn.className = "nav-btn flex flex-col items-center space-y-1 text-slate-400 hover:text-slate-200 transition";
        let icon = btn.querySelector('i');
        if (icon) {
          icon.classList.remove('stroke-[2.5px]', 'text-pink-500');
          icon.classList.add('stroke-2');
        }
      });

      const activeBtn = document.getElementById(`nav-${tab}`);
      if (activeBtn) {
        activeBtn.className = "nav-btn flex flex-col items-center space-y-1 text-pink-500 font-semibold transition";
        let activeIcon = activeBtn.querySelector('i');
        if (activeIcon) {
          activeIcon.classList.remove('stroke-2');
          activeIcon.classList.add('stroke-[2.5px]');
        }
      }

      renderContent();
    }

    function selectPackage(amount, planName) {
      selectedAmount = amount;
      selectedPlanName = planName;
      const label = document.getElementById("selected-plan-label");
      if (label) {
        label.textContent = `${planName} - KES ${amount}`;

      const main = document.getElementById('main-content');
      if (!main) return;

              `).join('')}

                  <div class="text-[10px] text-slate-400">Calls</div>
                  <div class="text-sm font-bold text-white">KES 200</div>
                  <div class="text-[9px] text-pink-400 mt-0.5">30 Mins</div>

                  <div class="text-[10px] text-slate-400">VIP</div>
                  <div class="text-sm font-bold text-white">KES 500</div>
                  <div class="text-[9px] text-pink-400 mt-0.5">Unlimited</div>
                </button>
              </div>

              <div class="flex justify-between items-center text-xs pt-1 px-1">
                <span class="text-slate-400">Selected:</span>
                <span id="selected-plan-label" class="font-bold text-pink-400">${selectedPlanName} (KES ${selectedAmount})</span>
              </div>

              <div>
                <label for="phone-input" class="block text-[10px] font-medium text-slate-400 mb-1">M-Pesa Phone Number</label>

                />
              </div>

                id="pay-btn" 
                onclick="handleMpesaCheckout()" 
                class="w-full py-2.5 px-4 bg-emerald-600 hover:bg-emerald-500 text-white font-bold rounded-xl transition duration-200 shadow-lg shadow-emerald-600/20 text-xs cursor-pointer">
                Pay via M-Pesa STK Push
              </button>
            </div>

            <div class="space-y-2.5 pt-1">

              <button onclick="alert('Privacy mode: Incognito enabled')" class="w-full flex items-center justify-between p-3.5 bg-slate-700/50 hover:bg-slate-700 border border-slate-700 rounded-xl text-sm font-medium text-slate-200 transition">

    function handleLike(name) {
      alert(`You liked ${name}! Match notification sent.`);
    }

    function handleSendMessage(e) {
      e.preventDefault();
      const input = document.getElementById('msg-input');
      if (!input) return;
      const text = input.value.trim();
      if (!text) return;

      messages.push({ id: Date.now(), sender: 'You', text: text, time: 'Just now', isMe: true });
      input.value = '';
      renderContent();
    }
