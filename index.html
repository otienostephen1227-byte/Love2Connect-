<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Love2Connect - Elite Social Discovery</title>
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Lucide Icons -->
  <script src="https://unpkg.com/lucide@latest"></script>
  <!-- Supabase JS SDK -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body class="bg-slate-900 text-slate-100 pb-24 font-sans">

  <!-- Main Content Container -->
  <main class="max-w-md mx-auto p-4">
    <header class="text-center py-6">
      <h1 class="text-3xl font-bold text-pink-500">Love2Connect</h1>
      <p class="text-slate-400 text-sm mt-1">Elite Social Discovery</p>
    </header>

    <!-- M-Pesa Payment Card -->
    <div class="bg-slate-800 border border-slate-700 rounded-xl p-6 shadow-xl mb-8">
      <h3 class="text-xl font-semibold text-white mb-2">Upgrade Account</h3>
      <p class="text-slate-300 text-sm mb-4">Enter your Safaricom phone number to process payment via M-Pesa STK Push:</p>
      
      <div class="space-y-4">
        <div>
          <label for="phone-input" class="block text-xs font-medium text-slate-400 mb-1">M-Pesa Phone Number</label>
          <input 
            type="text" 
            id="phone-input" 
            placeholder="07XXXXXXXX or 2547XXXXXXXX" 
            class="w-full px-4 py-3 rounded-lg bg-slate-900 border border-slate-700 text-white placeholder-slate-500 focus:outline-none focus:border-pink-500"
          />
        </div>
        
        <button 
          id="pay-btn" 
          onclick="handleMpesaCheckout()" 
          class="w-full py-3.5 px-4 bg-emerald-600 hover:bg-emerald-500 text-white font-bold rounded-lg transition duration-200 shadow-lg cursor-pointer">
          Pay KES 100
        </button>
      </div>
    </div>
  </main>

  <!-- M-Pesa Integration Script -->
  <script>
    async function handleMpesaCheckout() {
      const phoneInput = document.getElementById("phone-input");
      const payBtn = document.getElementById("pay-btn");
      const phone = phoneInput.value.trim();
      const amount = 100;

      if (!phone) {
        alert("Please enter a valid phone number.");
        return;
      }

      payBtn.disabled = true;
      payBtn.textContent = "Processing...";

      try {
        const response = await fetch("https://ycoywnfsfqygubszrzzt.supabase.co/functions/v1/stk-push", {
          method: "POST",
          headers: {
            "Content-Type": "application/json",
          },
          body: JSON.stringify({ phone, amount }),
        });

        const result = await response.json();
        console.log("M-Pesa Response:", result);

        if (result.success && result.data && result.data.ResponseCode === "0") {
          alert("STK Push sent successfully! Check your phone for the M-Pesa prompt.");
        } else {
          const errorMsg = result.data?.errorMessage || result.error || "Unknown error";
          alert("Failed to initiate payment: " + errorMsg);
        }
      } catch (err) {
        console.error("Network or code error:", err);
        alert("An error occurred. Please check your network connection.");
      } finally {
        payBtn.disabled = false;
        payBtn.textContent = "Pay KES 100";
      }
    }
  </script>
</body>
</html>
