<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Love2Connect</title>
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Lucide Icons -->
  <script src="https://unpkg.com/lucide@latest"></script>
  <!-- Supabase JS SDK -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body class="bg-slate-50 text-slate-800 pb-20">

  <!-- Top Header -->
  <header class="sticky top-0 z-10 bg-gradient-to-r from-pink-500 via-purple-500 to-indigo-600 text-white p-4 shadow-md flex items-center justify-between">
    <div class="flex items-center space-x-2">
      <i data-lucide="heart" class="w-7 h-7 text-pink-200 fill-current"></i>
      <h1 class="text-xl font-bold tracking-wide">Love2Connect</h1>
    </div>
    <div id="backend-status" class="text-xs bg-white/20 px-3 py-1 rounded-full font-medium backdrop-blur-sm">
      Checking connection...
    </div>
  </header>

  <!-- Main Content Area -->
  <main id="main-content" class="p-4 max-w-lg mx-auto w-full">
    <!-- Content injected via JavaScript -->
  </main>

  <!-- Bottom Navigation Bar -->
  <nav class="fixed bottom-0 left-0 right-0 bg-white/90 backdrop-blur-md border-t border-slate-200 px-6 py-2 flex justify-around items-center z-50">
    <button onclick="switchTab('discover')" id="nav-discover" class="nav-btn flex flex-col items-center space-y-1 text-pink-600 font-semibold scale-105 transition">
      <i data-lucide="sparkles" class="w-5 h-5 stroke-[2.5px]"></i>
      <span class="text-[11px]">Discover</span>
    </button>
    <button onclick="switchTab('chat')" id="nav-chat" class="nav-btn flex flex-col items-center space-y-1 text-slate-400 hover:text-slate-600 transition">
      <i data-lucide="message-square" class="w-5 h-5 stroke-2"></i>
      <span class="text-[11px]">Chat</span>
    </button>
    <button onclick="switchTab('call')" id="nav-call" class="nav-btn flex flex-col items-center space-y-1 text-slate-400 hover:text-slate-600 transition">
      <i data-lucide="phone" class="w-5 h-5 stroke-2"></i>
      <span class="text-[11px]">Call</span>
    </button>
    <button onclick="switchTab('profile')" id="nav-profile" class="nav-btn flex flex-col items-center space-y-1 text-slate-400 hover:text-slate-600 transition">
      <i data-lucide="user" class="w-5 h-5 stroke-2"></i>
      <span class="text-[11px]">Profile</span>
    </button>
  </nav>

  <script>
    // Supabase Configuration with your credentials
    const supabaseUrl = 'https://ycoywnfsfqygubszrzzt.supabase.co';
    const supabaseAnonKey = 'sb_publishable_240ym7HucnCx-1d3PvuhOg_8ReZALm6';
    let supabaseClient = null;

    if (supabaseUrl && supabaseAnonKey) {
      supabaseClient = supabase.createClient(supabaseUrl, supabaseAnonKey);
      document.getElementById('backend-status').innerText = 'Backend Connected';
    } else {
      document.getElementById('backend-status').innerText = 'Demo Mode';
    }

    let currentTab = 'discover';
    let messages = [
      { id: 1, sender: 'Chloe', text: 'Hey there! How is your day going?', time: '14:20', isMe: false },
      { id: 2, sender: 'You', text: 'Hi Chloe! Going great, just checking out Love2Connect.', time: '14:22', isMe: true },
    ];

    function switchTab(tab) {
      currentTab = tab;
      
      document.querySelectorAll('.nav-btn').forEach(btn => {
        btn.className = "nav-btn flex flex-col items-center space-y-1 text-slate-400 hover:text-slate-600 transition";
        let icon = btn.querySelector('i');
        if (icon) {
          icon.classList.remove('stroke-[2.5px]');
          icon.classList.add('stroke-2');
        }
        btn.classList.remove('scale-105', 'text-pink-600', 'font-semibold');
      });

      const activeBtn = document.getElementById(`nav-${tab}`);
      if (activeBtn) {
        activeBtn.className = "nav-btn flex flex-col items-center space-y-1 text-pink-600 font-semibold scale-105 transition";
        let activeIcon = activeBtn.querySelector('i');
        if (activeIcon) {
          activeIcon.classList.remove('stroke-2');
          activeIcon.classList.add('stroke-[2.5px]');
        }
      }

      renderContent();
    }

    function renderContent() {
      const main = document.getElementById('main-content');
      if (!main) return;
      
      if (currentTab === 'discover') {
        main.innerHTML = `
          <section class="space-y-4">
            <div class="flex items-center justify-between mb-2">
              <h2 class="text-lg font-bold text-slate-900 flex items-center gap-2">
                <i data-lucide="sparkles" class="w-5 h-5 text-pink-500"></i> Discover Matches
              </h2>
            </div>
            ${[
              { name: 'Chloe, 24', location: 'Nairobi, Kenya', img: 'https://images.unsplash.com/photo-1534528741775-53994a69daeb?auto=format&fit=crop&w=150&q=80', bio: 'Adventurous spirit looking for genuine connections.' },
              { name: 'Liam, 27', location: 'Mombasa, Kenya', img: 'https://images.unsplash.com/photo-1507003211169-0a1dd7228f2d?auto=format&fit=crop&w=150&q=80', bio: 'Coffee lover, tech enthusiast, and weekend surfer.' },
              { name: 'Sofia, 25', location: 'Kisumu, Kenya', img: 'https://images.unsplash.com/photo-1494790108377-be9c29b29330?auto=format&fit=crop&w=150&q=80', bio: 'Arts and culture seeker, love deep conversations.' }
            ].map(profile => `
              <div class="bg-white rounded-2xl shadow-sm border border-slate-100 p-5 space-y-3">
                <div class="flex items-center space-x-4">
                  <img src="${profile.img}" alt="${profile.name}" class="w-14 h-14 rounded-full object-cover shadow" />
                  <div>
                    <h3 class="font-bold text-slate-900">${profile.name}</h3>
                    <p class="text-xs text-slate-500">${profile.location}</p>
                  </div>
                </div>
                <p class="text-sm text-slate-600">${profile.bio}</p>
                <div class="flex gap-2 pt-2">
                  <button class="flex-1 bg-pink-500 hover:bg-pink-600 text-white font-medium py-2 rounded-xl text-sm transition shadow-sm flex items-center justify-center gap-1">
                    <i data-lucide="heart" class="w-4 h-4 fill-current"></i> Like
                  </button>
                  <button onclick="switchTab('chat')" class="flex-1 bg-slate-100 hover:bg-slate-200 text-slate-700 font-medium py-2 rounded-xl text-sm transition flex items-center justify-center gap-1">
                    <i data-lucide="message-square" class="w-4 h-4"></i> Message
                  </button>
                </div>
              </div>
            `).join('')}
          </section>
        `;
      } else if (currentTab === 'chat') {
        main.innerHTML = `
          <section class="bg-white rounded-2xl shadow-sm border border-slate-100 flex flex-col h-[75vh]">
            <div class="p-4 border-b border-slate-100 flex items-center justify-between">
              <div class="flex items-center space-x-3">
                <img src="https://images.unsplash.com/photo-1534528741775-53994a69daeb?auto=format&fit=crop&w=150&q=80" class="w-10 h-10 rounded-full object-cover" />
                <div>
                  <h3 class="font-bold text-slate-900 text-sm">Chloe</h3>
                  <span class="text-xs text-emerald-500 font-medium">● Online</span>
                </div>
              </div>
              <button onclick="switchTab('call')" class="p-2 text-purple-600 hover:bg-purple-50 rounded-full">
                <i data-lucide="phone" class="w-5 h-5"></i>
              </button>
            </div>
            <div id="chat-messages" class="flex-1 p-4 overflow-y-auto space-y-3">
              ${messages.map(msg => `
                <div class="flex ${msg.isMe ? 'justify-end' : 'justify-start'}">
                  <div class="max-w-[80%] rounded-2xl px-4 py-2.5 text-sm ${msg.isMe ? 'bg-purple-600 text-white rounded-br-none' : 'bg-slate-100 text-slate-800 rounded-bl-none'}">
                    <p>${msg.text}</p>
                    <span class="text-[10px] block mt-1 ${msg.isMe ? 'text-purple-200 text-right' : 'text-slate-400'}">${msg.time}</span>
                  </div>
                </div>
              `).join('')}
            </div>
            <form onsubmit="handleSendMessage(event)" class="p-3 border-t border-slate-100 flex items-center space-x-2">
              <input type="text" id="msg-input" placeholder="Type a message..." class="flex-1 bg-slate-50 border border-slate-200 rounded-xl px-4 py-2.5 text-sm focus:outline-none focus:ring-2 focus:ring-purple-500" />
              <button type="submit" class="p-2.5 bg-purple-600 text-white rounded-xl hover:bg-purple-700">
                <i data-lucide="send" class="w-4 h-4"></i>
              </button>
            </form>
          </section>
        `;
        const chatContainer = document.getElementById('chat-messages');
        if (chatContainer) chatContainer.scrollTop = chatContainer.scrollHeight;
      } else if (currentTab === 'call') {
        main.innerHTML = `
          <section class="bg-gradient-to-b from-slate-900 to-slate-800 text-white rounded-3xl p-8 flex flex-col items-center justify-between text-center min-h-[70vh] shadow-xl">
            <div class="space-y-2 mt-6">
              <span class="text-xs uppercase tracking-widest text-pink-400 font-semibold">Voice & Video Call</span>
              <h2 class="text-2xl font-bold">Chloe</h2>
              <p class="text-xs text-slate-400">Ready to connect...</p>
            </div>
            <div class="relative">
              <img src="https://images.unsplash.com/photo-1534528741775-53994a69daeb?auto=format&fit=crop&w=150&q=80" class="w-32 h-32 rounded-full object-cover border-4 border-pink-500 animate-pulse shadow-2xl" />
            </div>
            <div class="flex items-center space-x-6 mb-6">
              <button class="p-4 bg-slate-700/80 hover:bg-slate-700 rounded-full text-white shadow-lg"><i data-lucide="phone" class="w-6 h-6"></i></button>
              <button class="p-5 bg-emerald-500 hover:bg-emerald-600 rounded-full text-white shadow-lg transform hover:scale-105 transition"><i data-lucide="video" class="w-7 h-7"></i></button>
            </div>
          </section>
        `;
      } else if (currentTab === 'profile') {
        main.innerHTML = `
          <section class="bg-white rounded-2xl shadow-sm border border-slate-100 p-6 space-y-6">
            <div class="flex flex-col items-center text-center space-y-3">
              <div class="w-24 h-24 rounded-full bg-gradient-to-tr from-purple-500 to-pink-500 p-1 shadow-md">
                <div class="w-full h-full rounded-full bg-white flex items-center justify-center text-3xl font-bold text-purple-600">U</div>
              </div>
              <div>
                <h2 class="text-xl font-bold text-slate-900">Your Profile</h2>
                <p class="text-xs text-emerald-600 font-medium">● Backend Connected via Supabase</p>
              </div>
            </div>
            <div class="space-y-3 pt-2">
              <button class="w-full flex items-center justify-between p-3.5 bg-slate-50 hover:bg-slate-100 rounded-xl text-sm font-medium text-slate-700 transition">
                <span class="flex items-center gap-2"><i data-lucide="user" class="w-4 h-4 text-purple-500"></i> Edit Profile Details</span><span>›</span>
              </button>
              <div id="mpesa-section" class="pt-2 border-t border-slate-100 mt-2">
                <p class="text-xs text-slate-500 mb-2 font-medium">PREMIUM FEATURES</p>
                <button onclick="showMpesaPrompt()" class="w-full flex items-center justify-between p-3.5 bg-emerald-50 hover:bg-emerald-100 border border-emerald-200 rounded-xl text-sm font-medium text-emerald-800 transition shadow-sm">
                  <span class="flex items-center gap-2"><i data-lucide="credit-card" class="w-4 h-4 text-emerald-600"></i> Pay with M-Pesa</span><span>›</span>
                </button>
              </div>
              <button class="w-full flex items-center justify-between p-3.5 bg-slate-50 hover:bg-slate-100 rounded-xl text-sm font-medium text-slate-700 transition">
                <span class="flex items-center gap-2"><i data-lucide="settings" class="w-4 h-4 text-purple-500"></i> Account Settings</span><span>›</span>
              </button>
            </div>
          </section>
        `;
      }

      if (window.lucide) {
        lucide.createIcons();
      }
    }

    function handleSendMessage(e) {
      e.preventDefault();
      const input = document.getElementById('msg-input');
      if (!input) return;
      const text = input.value.trim();
      if (!text) return;

      messages.push({ id: Date.now(), sender: 'You', text: text, time: 'Just now', isMe: true });
      input.value = '';
      renderContent();
    }

    function showMpesaPrompt() {
      const phone = prompt("Enter your M-Pesa registered phone number (e.g., 0712345678):");
      if (phone) {
        alert("STK push sent to " + phone + ". Enter your M-Pesa PIN to complete the credit purchase.");
      }
    }

    renderContent();
  </script>
</body>
        </html>
