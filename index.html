<script>
'use strict';

const URL='https://ycoywnfsfqygubszrzzt.supabase.co', KEY='sb_publishable_240ym7HucnCx-1d3PvuhOg_8ReZALm6';
const sb=window.supabase?.createClient?window.supabase.createClient(URL,KEY):null;
const $=id=>document.getElementById(id), esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let current='discover',session=null,me=null,wallet=null,people=[],picked=null,preview='',conversation=null,authMode='in';
const demos=[
['Amani Wanjiku','Nairobi, Kenya','Rooftop sunsets, live music, trying new restaurants and meaningful conversations. Tell me your favourite place in the city.','1998-06-12',['Music','Food','Travel'],'photo-1534528741775-53994a69daeb'],
['Jabari Mwangi','Mombasa, Kenya','Coastal soul who enjoys ocean walks, football, Swahili food and weekend adventures. Kindness and humour matter to me.','1996-02-18',['Beach','Football','Cooking'],'photo-1507003211169-0a1dd7228f2d'],
['Nia Achieng','Kisumu, Kenya','Creative, curious and happiest around Lake Victoria. I enjoy photography, dancing and discovering little cafés.','2000-09-04',['Photography','Dancing','Art'],'photo-1531123897727-8f129e1688ce'],
['Kofi Otieno','Nakuru, Kenya','Nature lover, gym beginner and enthusiastic road-trip planner. I value honesty, family and laughter.','1995-11-23',['Nature','Fitness','Road trips'],'photo-1500648767791-00dcc994a43e'],
['Zuri Njeri','Ongata Rongai, Kenya','A book lover who dances while cooking and never says no to a spontaneous coffee date.','1999-03-15',['Books','Coffee','Dance'],'photo-1524504388940-b1c1722653e1'],
['Tendaji Kiptoo','Eldoret, Kenya','Outdoors most weekends, especially for a run or a mountain view. I enjoy calm people and sharing good food.','1997-07-08',['Running','Outdoors','Food'],'photo-1531384441138-2736e62e0919'],
['Wairimu Kamau','Nyeri, Kenya','Mountain air, farmers markets and soulful playlists are my kind of weekend. I appreciate honesty.','1998-12-01',['Music','Nature','Cooking'],'photo-1517841905240-472988babdf9'],
['Malik Barasa','Kakamega, Kenya','Easy-going, ambitious and always ready to learn something new. I enjoy basketball and community projects.','1994-05-27',['Basketball','Community','Tech'],'photo-1506794778202-cad84cf45f1d'],
['Imani Mutua','Machakos, Kenya','A bright spirit who loves fashion, art and exploring new places. Looking for a respectful connection.','2001-01-19',['Fashion','Art','Travel'],'photo-1529139574466-a303027c1d8b'],
['Ayo Muriuki','Meru, Kenya','Tea, hiking trails and conversations beyond small talk. I believe the best connections start with being yourself.','1996-08-30',['Hiking','Tea','Culture'],'photo-1519085360753-af0119f7cbe7']
].map((p,i)=>({id:'sample'+i,full_name:p[0],location:p[1],bio:p[2],date_of_birth:p[3],interests:p[4],profile_photo_url:'https://images.unsplash.com/'+p[5]+'?auto=format&fit=crop&w=900&q=85',is_demo:true}));
function toast(s,err=false){$('toast').textContent=s;$('toast').className='fixed z-[90] bottom-24 left-4 right-4 max-w-md mx-auto p-4 rounded-2xl border text-sm '+(err?'bg-red-950 border-red-500/30':'bg-slate-800 border-white/10');setTimeout(()=>$('toast').classList.add('hidden'),4500)}
function icons(){window.lucide&&lucide.createIcons()}
function age(d){if(!d)return null;let b=new Date(d+'T00:00:00');if(isNaN(+b))return null;let n=new Date(),a=n.getFullYear()-b.getFullYear();if(n.getMonth()<b.getMonth()||(n.getMonth()===b.getMonth()&&n.getDate()<b.getDate()))a--;return a}
function header(){ $('authbtn').textContent=session?'Sign out':'Sign in';$('authbtn').onclick=session?logout:authOpen;$('credits').textContent=wallet?.credits??'—';}
async function init(){if(!sb){$('status').textContent='Supabase SDK unavailable';render();return}try{let r=await sb.auth.getSession();session=r.data.session;if(r.error)throw r.error;sb.auth.onAuthStateChange((_e,s)=>{session=s;setTimeout(async()=>{await loadMine();header();render();},0)});await loadMine();let ping=await sb.from('profiles').select('id').limit(1);$('status').textContent=ping.error?'Connected · check database access':'Supabase connected';$('status').className='text-xs '+(ping.error?'text-amber-300':'text-emerald-400')}catch(e){$('status').textContent='Connection needs attention'}header();render()}
async function loadMine(){me=null;wallet=null;if(!session)return;let p=await sb.from('profiles').select('*').eq('id',session.user.id).maybeSingle();me=p.data||null;let w=await sb.from('wallets').select('credits').eq('user_id',session.user.id).maybeSingle();wallet=w.data||null}
function tab(t){current=t;document.querySelectorAll('.nav').forEach(b=>{b.classList.remove('active');b.classList.add('text-slate-400')});$('n-'+t)?.classList.add('active');$('n-'+t)?.classList.remove('text-slate-400');render()}window.tab=tab;
function authOpen(){if(session){logout();return}authMode='in';$('modal').innerHTML=`<div class="fixed inset-0 z-[70] bg-black/80 p-4 flex items-center justify-center"><div class="bg-slate-900 border border-white/10 rounded-3xl p-5 w-full max-w-md"><div class="flex justify-between mb-4"><h2 class="text-xl font-bold">Welcome to Love2Connect</h2><button onclick="closeModal()"><i data-lucide="x"></i></button></div><p class="text-sm text-slate-400 mb-4">Create an account to meet people. You must be at least 18.</p><div class="grid grid-cols-2 gap-2 mb-4"><button id="modein" class="btn primary" onclick="setMode('in')">Sign in</button><button id="modeup" class="btn secondary" onclick="setMode('up')">Create account</button></div><form onsubmit="authSubmit(event)" class="space-y-3"><div id="namewrap" class="hidden"><label class="text-sm">Full name<input id="authname" class="field mt-1" required></label></div><label class="text-sm">Email<input id="email" class="field mt-1" type="email" required autocomplete="email"></label><label class="text-sm">Password<input id="password" class="field mt-1" type="password" minlength="8" required autocomplete="current-password"></label><button id="authsubmit" class="btn primary w-full">Sign in</button><button type="button" class="w-full text-sm text-pink-300 p-2" onclick="resetPassword()">Forgot password?</button></form></div></div>`;icons()}
window.closeModal=()=>$('modal').innerHTML='';
window.setMode=m=>{authMode=m;$('namewrap').classList.toggle('hidden',m!=='up');$('modein').className='btn '+(m==='in'?'primary':'secondary');$('modeup').className='btn '+(m==='up'?'primary':'secondary');$('authsubmit').textContent=m==='in'?'Sign in':'Create account';$('authname').required=m==='up';$('password').autocomplete=m==='in'?'current-password':'new-password'};
window.authSubmit=async e=>{e.preventDefault();let b=$('authsubmit');b.disabled=true;try{let email=$('email').value.trim(),password=$('password').value;if(authMode==='up'){let name=$('authname').value.trim();if(!name)throw Error('Enter your name');let r=await sb.auth.signUp({email,password,options:{data:{full_name:name}}});if(r.error)throw r.error;if(r.data.session){session=r.data.session;closeModal();await loadMine();tab('profile')}else{closeModal();toast('Check your email to confirm your account, then sign in.')}}else{let r=await sb.auth.signInWithPassword({email,password});if(r.error)throw r.error;session=r.data.session;closeModal();await loadMine();tab(me?'discover':'profile');toast('Signed in successfully')}}catch(e){toast(e.message||'Authentication failed',true)}finally{b.disabled=false;header()}};
window.resetPassword=async()=>{let email=$('email')?.value.trim();if(!email)return toast('Enter your email first');let r=await sb.auth.resetPasswordForEmail(email,{redirectTo:location.origin});toast(r.error?r.error.message:'If the account exists, a reset link will be sent.',!!r.error)};
async function logout(){let r=await sb.auth.signOut();if(r.error)toast(r.error.message,true);else{session=null;me=null;wallet=null;tab('discover')}header()}
function render(){if(current==='discover')discover();else if(current==='profile')profile();else if(current==='likes')likes();else chat()}
async function discover(){let app=$('app');app.innerHTML='<p class="text-slate-400">Loading people…</p>';let found=[];if(sb){let q=sb.from('profiles').select('id,full_name,username,date_of_birth,bio,location,gender,preferred_gender,interests,verified,profile_photo_url,created_at').limit(60);if(session)q=q.neq('id',session.user.id);let r=await q.order('created_at',{ascending:false});if(!r.error)found=(r.data||[]).map(p=>({...p,is_demo:false}))}people=found;if(current!=='discover')return;app.innerHTML=`<section class="space-y-5"><div class="rounded-3xl p-5 border border-pink-400/20 bg-gradient-to-br from-pink-950/70 via-slate-900 to-purple-950/60"><span class="text-xs uppercase tracking-widest text-pink-300 font-bold">Meet. Connect. Belong.</span><h1 class="text-2xl sm:text-3xl font-extrabold mt-2">Your next good conversation starts here.</h1><p class="text-sm text-slate-300 mt-2">Discover people from across Kenya. Be kind, curious and yourself.</p>${!session?'<button class="btn primary mt-4" onclick="authOpen()">Create your profile →</button>':!me?'<button class="btn primary mt-4" onclick="tab(\'profile\')">Finish your profile →</button>':''}</div><div class="flex justify-between items-end"><div><h2 class="text-xl font-bold">Discover people</h2><p class="text-sm text-slate-400">Different regions, stories and interests</p></div><small class="text-slate-400">${found.length} members · ${demos.length} samples</small></div><div class="grid sm:grid-cols-2 gap-5">${[...found,...demos].map(card).join('')}</div><p class="text-xs text-slate-500">Sample profiles and their portraits are illustrative demonstrations, not real members. They cannot receive likes or messages.</p></section>`;icons()}
function card(p){let a=age(p.date_of_birth);return `<article class="rounded-3xl overflow-hidden border border-white/10 bg-slate-900 shadow-xl"><div class="relative h-80 bg-slate-800"><img src="${esc(p.profile_photo_url)}" alt="${esc(p.is_demo?'Illustrative sample portrait':(p.full_name||'Member')+' profile photo')}" class="w-full h-full object-cover" loading="lazy" onerror="this.style.display='none'"><div class="absolute inset-0 bg-gradient-to-t from-slate-950 via-transparent to-black/20"></div>${p.is_demo?'<span class="demo absolute top-3 left-3 rounded-full px-3 py-1 text-[10px] font-bold">SAMPLE PROFILE</span>':p.verified?'<span class="absolute top-3 left-3 bg-blue-600 rounded-full px-3 py-1 text-xs">Verified</span>':''}<div class="absolute bottom-4 left-4"><h3 class="text-2xl font-extrabold">${esc(p.full_name||p.username||'Member')}${a>=18?', '+a:''}</h3><p class="text-sm text-slate-200">📍 ${esc(p.location||'Location not added')}</p></div></div><div class="p-4 space-y-3"><p class="text-sm text-slate-300">${esc(p.bio||'Still writing my introduction.')}</p><div class="flex flex-wrap gap-2">${(Array.isArray(p.interests)?p.interests:[]).slice(0,5).map(i=>`<span class="rounded-full bg-slate-800 px-3 py-1 text-xs">${esc(i)}</span>`).join('')}</div>${p.is_demo?'<div class="demo rounded-xl p-3 text-xs">Illustration only — cannot receive likes or messages.</div>':`<div class="flex gap-2"><button class="btn primary flex-1" onclick="like('${esc(p.id)}')">♥ Like</button><button class="btn secondary" onclick="message('${esc(p.id)}')">Chat</button></div>`}</div></article>`}
window.like=async id=>{if(!session)return authOpen();if(!me)return toast('Finish your profile first');let r=await sb.from('likes').insert({liker_id:session.user.id,liked_id:id});toast(r.error?(r.error.code==='23505'?'Already liked this profile.':'Could not save like. Check database policies.'):'Like saved! If they like you back, you can match.',!!r.error)};
window.message=async id=>{if(!session)return authOpen();let r=await sb.from('matches').select('id,user_1_id,user_2_id').or(`user_1_id.eq.${session.user.id},user_2_id.eq.${session.user.id}`);if(r.error)return toast('Could not load matches.',true);let m=(r.data||[]).find(x=>x.user_1_id===id||x.user_2_id===id);if(!m)return toast('You can chat after a mutual match. Send a like first.');let c=await sb.from('conversations').select('id').eq('match_id',m.id).maybeSingle();if(c.error||!c.data)return toast('Conversation is not set up for this match yet.');conversation=c.data.id;tab('chat')};
async function likes(){let app=$('app');if(!session){app.innerHTML=required('Sign in to see likes and matches.');icons();return}app.innerHTML='<p>Loading likes…</p>';let uid=session.user.id;let [inc,out,mat]=await Promise.all([sb.from('likes').select('liker_id').eq('liked_id',uid),sb.from('likes').select('liked_id').eq('liker_id',uid),sb.from('matches').select('id,user_1_id,user_2_id').or(`user_1_id.eq.${uid},user_2_id.eq.${uid}`)]);if(current!=='likes')return;let ids=[...new Set([...(inc.data||[]).map(x=>x.liker_id),...(out.data||[]).map(x=>x.liked_id),...(mat.data||[]).map(m=>m.user_1_id===uid?m.user_2_id:m.user_1_id)])],ps=[];if(ids.length){let r=await sb.from('profiles').select('id,full_name,username,location,profile_photo_url').in('id',ids);ps=r.data||[]}let rows=ps.map(p=>`<div class="flex items-center gap-3 py-3 border-t border-white/5"><img src="${esc(p.profile_photo_url)}" class="w-12 h-12 rounded-full object-cover bg-slate-700"><div class="flex-1"><b>${esc(p.full_name||p.username)}</b><p class="text-xs text-slate-400">${esc(p.location||'')}</p></div><button class="btn secondary text-xs" onclick="message('${esc(p.id)}')">Chat</button></div>`).join('');app.innerHTML=`<h1 class="text-2xl font-extrabold mb-4">Likes & Matches</h1><section class="rounded-2xl bg-slate-900 border border-white/10 p-4"><h2 class="font-bold mb-2">People who liked you / your connections</h2>${rows||'<p class="text-sm text-slate-400">No likes or matches yet. Keep discovering!</p>'}</section>`;icons()}
function required(msg){return `<section class="rounded-3xl bg-slate-900 border border-white/10 p-6 text-center"><i data-lucide="lock-keyhole" class="mx-auto w-10 h-10 text-pink-300"></i><h2 class="text-xl font-bold mt-3">Sign in required</h2><p class="text-sm text-slate-400 mt-2">${esc(msg)}</p><button class="btn primary mt-4" onclick="authOpen()">Sign in / Create account</button></section>`}
async function chat(){let app=$('app');if(!session){app.innerHTML=required('Sign in to chat with your matches.');icons();return}app.innerHTML='<p class="text-slate-400">Loading conversations…</p>';let uid=session.user.id,r=await sb.from('matches').select('id,user_1_id,user_2_id').or(`user_1_id.eq.${uid},user_2_id.eq.${uid}`);if(r.error){app.innerHTML='<p class="text-amber-200">Could not load matches. Review your Supabase policies.</p>';return}let ms=r.data||[];if(!ms.length){app.innerHTML='<section class="rounded-3xl bg-slate-900 border border-white/10 p-6 text-center"><h2 class="text-xl font-bold">Chat starts with a match</h2><p class="text-sm text-slate-400 mt-2">When you and another real member like each other, you can chat.</p><button class="btn primary mt-4" onclick="tab(\'discover\')">Discover people</button></section>';return}let cr=await sb.from('conversations').select('id,match_id').in('match_id',ms.map(m=>m.id));if(cr.error){app.innerHTML='<p class="text-amber-200">Could not load conversations. Review RLS policies.</p>';return}let convs=cr.data||[];if(!conversation||!convs.some(c=>c.id===conversation))conversation=convs[0]?.id||null;if(!conversation){app.innerHTML='<p class="text-slate-400">Matches exist, but conversations need to be created by secure database logic.</p>';return}let mr=await sb.from('messages').select('id,sender_id,text,created_at').eq('conversation_id',conversation).order('created_at').limit(100);let list=(mr.data||[]).map(m=>`<div class="flex ${m.sender_id===uid?'justify-end':'justify-start'}"><div class="max-w-[85%] rounded-2xl p-3 ${m.sender_id===uid?'grad':'bg-slate-800'}"><p class="text-sm break-words">${esc(m.text)}</p><small class="text-[10px] opacity-70">${new Date(m.created_at).toLocaleString()}</small></div></div>`).join('')||'<p class="text-sm text-slate-400 text-center py-6">Say hello and start the conversation.</p>';app.innerHTML=`<h1 class="text-2xl font-extrabold mb-4">Your chats</h1><div class="rounded-2xl border border-white/10 bg-slate-900 min-h-[55vh] flex flex-col"><div class="p-3 border-b border-white/10">${convs.map(c=>`<button onclick="chooseChat('${esc(c.id)}')" class="btn ${c.id===conversation?'primary':'secondary'} text-xs mr-1 mb-1">Conversation ${convs.indexOf(c)+1}</button>`).join('')}</div><div id="msgs" class="p-3 space-y-3 flex-1 max-h-[55vh] overflow-y-auto">${mr.error?'<p class="text-amber-200">Could not load messages. Check RLS.</p>':list}</div><form class="p-3 border-t border-white/10 flex gap-2" onsubmit="sendMsg(event)"><input id="msg" class="field min-w-0" maxlength="2000" required placeholder="Write a kind message…"><button class="btn primary" type="submit"><i data-lucide="send"></i></button></form></div>`;icons();$('msgs').scrollTop=$('msgs').scrollHei
